<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: A; src: url(anton.woff2); }
@font-face { font-family: I; src: url(inter.woff2); font-weight: 800; }
html,body{margin:0;background:#000}
.t{position:relative;overflow:hidden;background:#000}
.t img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.15) saturate(1.2)}
.shade{position:absolute;inset:0}
.big{position:absolute;font-family:A;color:#fff;line-height:.88;text-transform:uppercase;-webkit-text-stroke:0;paint-order:stroke fill}
.red{color:#FF3B30}
.badge{position:absolute;font-family:A;background:#FF3B30;color:#fff;transform:rotate(-6deg);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.sm{position:absolute;font-family:I;font-weight:800;color:#fff;letter-spacing:2px}
/* vertical 1080x1920 */
#v{width:1080px;height:1920px}
#v .shade{background:linear-gradient(180deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.85) 80%)}
#v .big{left:50%;transform:translateX(-50%);text-align:center;width:1000px;text-shadow:0 0 0 #000,0 8px 0 #000,0 0 40px rgba(0,0,0,.9)}
/* horizontal 1280x720 */
#h{width:1280px;height:720px}
#h img.bg{object-position:50% 45%}
#h .shade{background:linear-gradient(90deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.6) 45%,rgba(0,0,0,0) 70%)}
#h .big{left:50px;text-shadow:0 6px 0 #000,0 0 30px rgba(0,0,0,.9)}
.stroke{ -webkit-text-stroke: 14px #000; }
</style></head><body>
<div class="t" id="v">
  <img class="bg" src="../assets/img/eye.png">
  <div class="shade"></div>
  <div class="big" style="top:150px;font-size:430px"><span class="red">11</span></div>
  <div class="big" style="top:560px;font-size:150px">DÍAS SIN<br>DORMIR</div>
  <div class="badge" style="right:70px;top:1080px;font-size:90px;padding:10px 34px">264 HORAS</div>
  <div class="big" style="top:1420px;font-size:118px">MIRA LO QUE LE<br><span class="red">PASÓ</span> A SU CEREBRO</div>
</div>
<div class="t" id="h">
  <img class="bg" src="../assets/img/eye.png">
  <div class="shade"></div>
  <div class="big" style="top:40px;font-size:330px"><span class="red">11</span></div>
  <div class="big" style="top:330px;font-size:120px">DÍAS SIN DORMIR</div>
  <div class="big" style="top:465px;font-size:92px">ESTO LE <span class="red">PASÓ</span> 🧠</div>
  <div class="badge" style="left:330px;top:70px;font-size:64px;padding:6px 24px">RÉCORD PROHIBIDO</div>
</div>
</body></html>
